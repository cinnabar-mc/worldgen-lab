[package]
name = "steel-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
steel-core = { git = "https://github.com/cinnabar-mc/SteelMC", rev = "ff8e48c5b751788a6939be57b32932fbbc85ecc3" }
steel-worldgen = { git = "https://github.com/cinnabar-mc/SteelMC", rev = "ff8e48c5b751788a6939be57b32932fbbc85ecc3" }
steel-registry = { git = "https://github.com/cinnabar-mc/SteelMC", rev = "ff8e48c5b751788a6939be57b32932fbbc85ecc3" }
steel-utils = { git = "https://github.com/cinnabar-mc/SteelMC", rev = "ff8e48c5b751788a6939be57b32932fbbc85ecc3" }
rayon = "1.12.0"
rustc-hash = "2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1.1.3"

[profile.release]
debug = 0
