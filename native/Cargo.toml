[package]
name = "steel-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
steel-core = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "6749ecf6d24a420d61a997779219edec0b21da9e", features = ["test-framework"] }
steel-worldgen = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "6749ecf6d24a420d61a997779219edec0b21da9e" }
steel-registry = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "6749ecf6d24a420d61a997779219edec0b21da9e" }
steel-utils = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "6749ecf6d24a420d61a997779219edec0b21da9e" }
rayon = "1.12.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1.1.3"

[profile.release]
debug = 0
